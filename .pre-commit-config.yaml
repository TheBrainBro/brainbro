repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Secrets in the staged changes. Same release as the CI scan.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  # Frontend lint, as in CI. No type check here: it reads the whole project, and
  # a commit can hold part of a change (tests go in their own). CI runs it.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        # The Semgrep rules submodule holds deliberately broken test code.
        entry: npm --prefix frontend exec -- oxlint --ignore-pattern=.github/semgrep/rules/**
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
