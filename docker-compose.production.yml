##########################################################################
# PRODUCTION stack, from the images published to GHCR.                   #
#                                                                        #
#   docker compose --env-file stack.env -f docker-compose.production.yml up -d
#                                                                        #
# Overrides, added with more -f options:                                 #
#   docker-compose.build.yml   builds the images from this checkout      #
#   docker-compose.umbrel.yml  the Umbrel firewall workaround            #
#                                                                        #
# Only `api` publishes a port. Postgres and Redis stay on the internal   #
# network. See docs/deployment.md.                                       #
##########################################################################

name: "brain"

x-app: &app
  image: ghcr.io/thebrainbro/brainbro:${BRAINBRO_VERSION:-latest}
  restart: unless-stopped
  environment:
    ENVIRONMENT: production
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -base64 48)}
    APP_HOSTNAMES: ${APP_HOSTNAMES:?APP_HOSTNAMES is required, e.g. brainbro.example.com}
    APP_HTTPS: ${APP_HTTPS:-true}
    APP_PROXY: ${APP_PROXY:-none}
    TIME_ZONE: ${TIME_ZONE:-UTC}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-brain}
    POSTGRES_USER: ${POSTGRES_USER:-brain}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    REDIS_URL: redis://redis:6379/0
    EMBEDDER_URL: http://embedder:8000
    BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-52428800}
    IMPORT_MAX_SIZE: ${IMPORT_MAX_SIZE:-104857600}
    SOURCE_CODE_URL: ${SOURCE_CODE_URL:-https://github.com/TheBrainBro/brainbro}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    SITE_CNAME_TARGET: ${SITE_CNAME_TARGET:-}
    SITE_IPV4: ${SITE_IPV4:-}
  volumes:
    - storage:/data/storage
    - backups:/data/backups
    - exports:/data/exports

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Semantic search: turns text into vectors, with a model built into the
  # image (nothing leaves the server). ~600 MB of memory. Without it, search
  # still works by words.
  embedder:
    image: ghcr.io/thebrainbro/brainbro-embedder:${BRAINBRO_VERSION:-latest}
    restart: unless-stopped

  # One-shot: backup if needed, migrate, ensure admin. api/worker wait for it.
  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      # Without APP_BIND, on every interface (IPv4 and IPv6).
      - "${APP_BIND:+${APP_BIND}:}${APP_PORT:-8420}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional, for servers with a public IP and ports 80/443 open: HTTPS for
  # the app and for blogs on their own domains, with certificates issued on
  # demand. Behind a tunnel it isn't needed. Start it with
  # `--profile caddy` (or COMPOSE_PROFILES=caddy). See docs/blogs.md.
  caddy:
    image: ghcr.io/thebrainbro/brainbro-caddy:${BRAINBRO_VERSION:-latest}
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      APP_HOSTNAMES: ${APP_HOSTNAMES}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage:
  backups:
  exports:
  caddy_data:
