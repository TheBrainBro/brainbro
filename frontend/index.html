<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser bar matches the top bar; theme/theme.ts keeps these in step. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="apple-mobile-web-app-title" content="Brain" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Brain</title>
    <script>
      // The theme picked in settings (theme/theme.ts), before the first paint.
      try {
        const theme = localStorage.getItem('brain:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          const bar = theme === 'dark' ? '#09090b' : '#ffffff'
          document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => (meta.content = bar))
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
