[project]
name = "brainbro-backend"
version = "1.0.0"
description = "BrainBro: One memory for all your AI assistants"
authors = [{ name = "Carlos Lugones", email = "contact@carloslugones.com" }]
license = "AGPL-3.0-only"
readme = "../README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=6.1.3,<7.0.0",
    "djangorestframework>=3.18.3,<4.0.0",
    "psycopg[binary,pool]>=3.3.8,<4.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "whitenoise>=6.12.0,<7.0.0",
    "celery[redis]>=5.6.3,<6.0.0",
    "django-unfold>=0.110.1,<0.111.0",
    "requests>=2.34.2,<3.0.0",
    "pillow>=13.0.0,<14.0.0",
    "python-magic>=0.4.27,<0.5.0",
    "pillow-heif>=1.8.1,<2.0.0",
    "pypdfium2>=5.14.0,<6.0.0",
    "markdown-it-py>=4,<5",
    "pgvector>=0.5.1,<0.6.0",
    "redis>=6.4.0,<7.0.0",
    "uvicorn>=0.54.0,<0.55.0",
    "pycrdt>=0.14.13,<0.15.0",
    "websockets>=17.4,<18.0",
    "dnspython>=2.9.2,<3.0.0",
    "mdit-py-plugins>=0.6.1,<0.7.0",
    "linkify-it-py>=2.2.0,<3.0.0",
    "nh3>=0.3.7,<0.4.0",
    "django-anymail[mailgun] (>=15.2,<16.0)",
    "cryptography (>=50.0.0,<51.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
pytest = "^9.2.0"
pytest-django = "^4.14.0"
pre-commit = "^4.7.0"

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "C", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle warnings
]

[tool.ruff.lint.isort]
# Explicit so imports sort the same whether ruff runs from backend/ or the
# repo root (pre-commit).
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "tests_*.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
