{% load static %}<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    {# X's privacy option: the post isn't used to personalize what X shows. #}
    <meta name="twitter:dnt" content="on" />
    <meta name="twitter:widgets:csp" content="on" />
    <title>Post on X</title>
  </head>
  <body style="margin: 0">
    <blockquote class="twitter-tweet" data-dnt="true">
      <a href="https://twitter.com/i/status/{{ post_id }}">https://twitter.com/i/status/{{ post_id }}</a>
    </blockquote>
    <script src="{% static 'public/embed-height.js' %}"></script>
    <script async src="https://platform.x.com/widgets.js"></script>
  </body>
</html>
