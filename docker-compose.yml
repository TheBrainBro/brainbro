#######################################################
# DEVELOPMENT services: Postgres, Redis, embedder.     #
# Django and Vite run on the host (`make dev`).        #
# Production stack: docker-compose.production.yml.     #
#######################################################

name: "brain-dev"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data

  # Semantic search. The first build downloads the model (~250 MB).
  embedder:
    build:
      context: docker/embedder
    restart: unless-stopped
    ports:
      - "${EMBEDDER_PORT:-8100}:8000"

volumes:
  postgres_data:
  redis_data:
