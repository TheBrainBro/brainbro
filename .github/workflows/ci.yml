name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out code and run checks.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: brain
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U brain" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.3.2
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run python manage.py makemigrations --check --dry-run
      - run: poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t brainbro:ci .
      - run: docker build -t brainbro-embedder:ci docker/embedder
      - name: Check the production compose files
        run: |
          prod="docker compose -f docker-compose.production.yml"
          $prod config -q
          $prod -f docker-compose.build.yml config -q
          $prod -f docker-compose.build.yml -f docker-compose.umbrel.yml config -q
        env:
          SECRET_KEY: ci
          APP_HOSTNAMES: ci
          POSTGRES_PASSWORD: ci
