name: Release

# Tags and publishes a GitHub release when a release/x.y.z or hotfix/x.y.z PR
# is merged into main. Same script as by hand: scripts/release.sh <pr>.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/release.sh ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
