name: Semgrep

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions: {}

jobs:
  # Static analysis with the security rules of a pinned semgrep-rules commit,
  # run offline. No schedule: the engine and the rules only change through
  # Dependabot pull requests, which run this check. Findings are in the log
  # and the job summary; see .github/semgrep/scan.sh to ignore one.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: .github/semgrep/scan.sh
