# Version updates, opened against develop like any other change.
#
# Monthly, with minor and patch updates grouped into one pull request per
# ecosystem; majors come one by one. Security fixes do not wait for this
# schedule: security updates open their own pull requests when an advisory
# is published.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Skip releases younger than a week: most compromised npm versions are
    # pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(frontend)
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /docker/embedder
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(infra)

  - package-ecosystem: docker
    directories:
      - /
      - /docker/*
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(infra)
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # A new Python is a deliberate upgrade (pyproject, CI, both images), not
      # a routine bump. Docker tags count 3.12 to 3.13 as a minor update.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(infra)
    groups:
      compose:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      hooks:
        update-types: [minor, patch]
